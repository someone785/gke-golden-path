# このリポジトリで使うツールの版を固定する。手元と CI で同じ版を使うため。
# 使い方: `mise install` (このディレクトリでは、ここに書いた版が優先される)
# 版の更新は、フェーズ 3 以降 Renovate に任せる。
#
# 【タグは後から付け替えられる】そのため、版の番号ではなく、mise.lock のチェックサムでバイナリそのものを固定する (ADR 0005)。
#   初回・更新時: `mise lock` (更新は `mise lock --bump <tool>`) → mise.lock の差分を確認してコミット
#   インストール: `mise install` (mise.lock にある版とチェックサムで入る)。CI では `mise install --locked` で、lock にないものをエラーにする
# 【lock した時点のバイナリが固定される】安全と分かっている版で lock すること。
#
# 【ここに [settings] locked = true を書かない】
#   locked はグローバルの設定 (~/.config/mise/config.toml) のツールにも効くため、
#   手元の node や starship が「lock にない」というエラーになる。厳格な検査は CI の --locked で行う。
# 【locked_require_checksum は、mise 2026.10.8 では「不明な設定」と警告される】(公式ドキュメントは、より新しい版の内容)

[tools]
terraform = "1.16.2"
tflint = "0.64.0"
trivy = "0.69.3"
# pre-commit のフックは repo: local で、この gitleaks を直接呼ぶ (.pre-commit-config.yaml)
gitleaks = "8.30.0"
pre-commit = "4.7.0"
# 【kubectl はクラスタの版と ±1 マイナー以内にする】2026-11-08 に作ったクラスタは 1.36.4-gke.2046003 (REGULAR チャンネル)。
# クラスタが自動で上がったら、ここも合わせて上げる
kubectl = "1.36.6"
# 手元の `helm template` で、chart に渡す values の展開を確かめるために使う (クラスタへの install には使わない。入れるのは ArgoCD)
helm = "4.3.1"
# SLO の定義から Prometheus のルールを生成する (フェーズ 2、ADR 0006)。operator ではなく CLI で使う
sloth = "0.16.0"
# ルールの検査に使う。【OTel Demo の chart 0.42.6 に同梱の Prometheus (v3.14.0) と版をそろえる】
# chart を上げて Prometheus の版が変わったら、ここも合わせる
promtool = "3.14.0"
# 自分のサービス (services/) とテンプレート (templates/service-go/) のビルドとテストに使う (フェーズ 3)。
# 【Dockerfile のビルド用のイメージの Go と版をそろえる】
go = "1.27.4"
# イメージの SBOM (Syft) と keyless 署名 (Cosign)。CI で使う (ADR 0008)。手元では検証 (cosign verify) に使う
syft = "1.56.0"
cosign = "3.1.4"
# 手元の Kubernetes (フェーズ 3)。node のイメージは scripts/kind-up.sh と kind/cluster.yaml で digest を固定する
kind = "0.33.0"
# Kustomize の overlay の確認 (kustomize build) と、イメージの digest の書き換え (kustomize edit set image) に使う (ADR 0009)
kustomize = "5.8.3"
