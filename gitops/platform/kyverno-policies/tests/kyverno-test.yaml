# Kyverno のポリシーのテスト。手元と CI で `kyverno test gitops/platform/kyverno-policies/tests` を実行する。
# 【verify-images は GHCR と Sigstore (Rekor) にアクセスする】ネットワークが要る。署名の検証は本物のイメージで行う
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-policies
policies:
  - ../verify-images.yaml
  - ../workload-baseline.yaml
resources:
  - good-pod.yaml
  - bad-pods.yaml
variables: values.yaml
results:
  - policy: workload-baseline
    resources: [good]
    kind: Pod
    result: pass
  - policy: workload-baseline
    resources: [other-registry, tag-not-digest, no-memory-limit, root]
    kind: Pod
    result: fail
  - policy: verify-own-images
    resources: [good]
    kind: Pod
    result: pass
