# 自分のサービスの namespace (ラベル gke-golden-path/workload=true) に入る Pod の方針 (ADR 0010)。
# ラベルは ApplicationSet (gitops/apps/common/workloads.yaml) が namespace を作るときに付ける。
# kube-system や OTel Demo の namespace は対象にしない (他者が作ったイメージで、署名もない)。
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: workload-baseline
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        gke-golden-path/workload: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    # 署名を確かめられるのは自分のレジストリのイメージだけ (verify-images.yaml)。ほかから持ち込ませない
    - expression: >-
        variables.containers.all(c, c.image.startsWith('ghcr.io/someone785/'))
      message: "イメージは ghcr.io/someone785/ のものだけを使う (署名を確かめられないため)"
    # 【タグではなく digest で参照する】タグは付け替えられるので、署名を確かめた中身と動く中身が変わり得る (ADR 0007)
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:'))
      message: "イメージはタグではなく digest (@sha256:...) で参照する"
    - expression: >-
        variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "すべてのコンテナにメモリの上限 (resources.limits.memory) を付ける"
    # Pod 全体か、すべてのコンテナで runAsNonRoot: true にする
    - expression: >-
        (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot == true)
        || variables.containers.all(c, has(c.securityContext) && has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot == true)
      message: "root で動かさない (securityContext.runAsNonRoot: true)"
