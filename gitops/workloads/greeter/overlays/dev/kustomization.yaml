# greeter の dev。main にマージされると、CI (.github/workflows/images.yml の deploy-dev) が
# images の digest を新しいイメージに書き換えてコミットする (ADR 0009)。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: greeter-dev
resources:
- ../../base
labels:
- pairs:
    app.kubernetes.io/environment: dev
# 【手で書き換えない】CI が `kustomize edit set image` で書き換える
images:
- digest: sha256:938afbd8c2632aa99ee4acf7dd25086bb56644f3e4921a07f6dd09ae993c0d41
  name: ghcr.io/someone785/greeter
