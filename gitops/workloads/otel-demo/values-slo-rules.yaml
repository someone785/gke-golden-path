# Code generated by scripts/gen-slo-rules.sh from gitops/workloads/otel-demo/slo/*.sloth.yaml. DO NOT EDIT.
# OpenTelemetry Demo の chart に渡す values。同梱の Prometheus の serverFiles にルールを入れる。
prometheus:
  serverFiles:
    alerting_rules.yml:
      groups:
      - name: sloth-slo-sli-recordings-checkout-place-order-availability
        rules:
        - record: slo:sli_error:ratio_rate5m
          expr: |
            (sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_name="oteldemo.CheckoutService/PlaceOrder",status_code="STATUS_CODE_ERROR"}[5m]))
            )
            /
            (sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_name="oteldemo.CheckoutService/PlaceOrder"}[5m]))
            )
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_service: checkout
            sloth_slo: place-order-availability
            sloth_window: 5m
        - record: slo:sli_error:ratio_rate30m
          expr: |
