            sloth_window: 1d
        - record: slo:sli_error:ratio_rate3d
          expr: |
            (sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_name="oteldemo.CheckoutService/PlaceOrder",status_code="STATUS_CODE_ERROR"}[3d]))
            )
            /
            (sum(rate(traces_span_metrics_calls_total{service_name="checkout",span_name="oteldemo.CheckoutService/PlaceOrder"}[3d]))
            )
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_service: checkout
            sloth_slo: place-order-availability
            sloth_window: 3d
        - record: slo:sli_error:ratio_rate30d
          expr: |
            sum_over_time(slo:sli_error:ratio_rate5m{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"}[30d])
            / ignoring (sloth_window)
            count_over_time(slo:sli_error:ratio_rate5m{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"}[30d])
