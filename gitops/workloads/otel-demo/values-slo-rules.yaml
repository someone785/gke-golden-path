      - name: sloth-slo-meta-recordings-checkout-place-order-availability
        rules:
        - record: slo:objective:ratio
          expr: vector(0.99)
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_service: checkout
            sloth_slo: place-order-availability
        - record: slo:error_budget:ratio
          expr: vector(1-0.99)
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_service: checkout
            sloth_slo: place-order-availability
        - record: slo:time_period:days
          expr: vector(30)
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_service: checkout
            sloth_slo: place-order-availability
        - record: slo:current_burn_rate:ratio
          expr: |
            slo:sli_error:ratio_rate5m{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
            slo:error_budget:ratio{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"}
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_service: checkout
            sloth_slo: place-order-availability
        - record: slo:period_burn_rate:ratio
          expr: |
            slo:sli_error:ratio_rate30d{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"}
            / on(sloth_id, sloth_slo, sloth_service) group_left
            slo:error_budget:ratio{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"}
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_service: checkout
            sloth_slo: place-order-availability
        - record: slo:period_error_budget_remaining:ratio
          expr: 1 - slo:period_burn_rate:ratio{sloth_id="checkout-place-order-availability",
            sloth_service="checkout", sloth_slo="place-order-availability"}
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_service: checkout
            sloth_slo: place-order-availability
        - record: sloth_slo_info
          expr: vector(1)
          labels:
            owner: gke-golden-path
            sloth_id: checkout-place-order-availability
            sloth_mode: cli-gen-prom
            sloth_objective: "99"
            sloth_service: checkout
            sloth_slo: place-order-availability
            sloth_spec: prometheus/v1
            sloth_version: v0.16.0
      - name: sloth-slo-alerts-checkout-place-order-availability
        rules:
        - alert: CheckoutPlaceOrderErrorBudgetBurn
          expr: |
            (
                max(slo:sli_error:ratio_rate5m{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"} > (14.4 * 0.01)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate1h{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"} > (14.4 * 0.01)) without (sloth_window)
            )
            or
            (
                max(slo:sli_error:ratio_rate30m{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"} > (6 * 0.01)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate6h{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"} > (6 * 0.01)) without (sloth_window)
            )
          labels:
            category: availability
            severity: page
            sloth_severity: page
          annotations:
            runbook_url: https://github.com/someone785/gke-golden-path/blob/main/docs/runbooks/checkout-place-order.md
            summary: checkout の注文の失敗が増え、エラーバジェットを速く消費している
            title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
              burn rate is too fast.
        - alert: CheckoutPlaceOrderErrorBudgetBurn
          expr: |
            (
                max(slo:sli_error:ratio_rate2h{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"} > (3 * 0.01)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate1d{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"} > (3 * 0.01)) without (sloth_window)
            )
            or
            (
                max(slo:sli_error:ratio_rate6h{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"} > (1 * 0.01)) without (sloth_window)
                and
                max(slo:sli_error:ratio_rate3d{sloth_id="checkout-place-order-availability", sloth_service="checkout", sloth_slo="place-order-availability"} > (1 * 0.01)) without (sloth_window)
            )
          labels:
            category: availability
            severity: ticket
            sloth_severity: ticket
          annotations:
            runbook_url: https://github.com/someone785/gke-golden-path/blob/main/docs/runbooks/checkout-place-order.md
            summary: checkout の注文の失敗が増え、エラーバジェットを速く消費している
            title: (ticket) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
              burn rate is too fast.
